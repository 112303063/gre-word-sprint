<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#111827" />
<title>GRE Word Sprint | 單字衝刺練習器</title>
<style>
:root{--bg:#0b1020;--panel:#141d33;--panel2:#1b2841;--line:#2e3b54;--text:#f1f5ff;--muted:#a6b4cb;--accent:#9a8cff;--a2:#54d7bb;--bad:#ff8a92;--good:#70e6b5;--shadow:0 20px 60px #05091275}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 10% 5%,#293060 0,transparent 45%),radial-gradient(ellipse at 90% 80%,#164338 0,transparent 35%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--a2);outline-offset:3px}.wrap{max-width:1080px;margin:auto;padding:36px 20px 72px}.eyebrow{color:var(--a2);font-size:13px;font-weight:800;letter-spacing:.17em}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:25px}h1{font-size:clamp(30px,5vw,54px);line-height:1.12;margin:12px 0;font-weight:850;letter-spacing:-.035em}.sub{color:var(--muted);line-height:1.8;margin:0}.hero-tag{border:1px solid #4d5278;background:#ffffff08;border-radius:16px;padding:12px 16px;white-space:nowrap;color:#d8d7ff}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:26px 0}.stat{padding:17px 20px;background:#151d32c9;border:1px solid var(--line);border-radius:18px}.stat strong{display:block;font-size:29px;margin-top:7px}.stat span{color:var(--muted);font-size:13px}.shell{background:#121b30d9;box-shadow:var(--shadow);border:1px solid #35405d;border-radius:25px;padding:23px}.tabs{display:flex;flex-wrap:wrap;gap:9px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px}.tab{border:1px solid transparent;background:transparent;color:var(--muted);padding:11px 18px;border-radius:12px;font-weight:750}.tab.active{background:var(--accent);color:#151128}.tab:hover:not(.active){background:#ffffff10;color:#fff}.section-title{font-size:23px;margin:0 0 8px}.section-desc{color:var(--muted);font-size:14px;line-height:1.7;margin:0 0 22px}.center{text-align:center}.flash{min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;background:linear-gradient(150deg,#23254a,#172f41);border:1px solid #4d567a;border-radius:21px;transition:transform .2s;cursor:pointer;user-select:none}.flash:hover{transform:translateY(-2px)}.flash .word{font-family:Georgia,serif;font-size:clamp(30px,6vw,52px);overflow-wrap:anywhere}.flash .hint{color:#bfc6e9;font-size:13px;margin-top:13px}.definition{font-size:clamp(19px,3vw,26px);font-weight:700;line-height:1.6}.example{color:#ccd4e9;line-height:1.8;margin:11px 0 0}.pill{display:inline-block;border:1px solid #687296;color:#c9d2ef;padding:5px 11px;border-radius:100px;font-size:12px;margin-bottom:16px}.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px}.btn{background:#303c5b;border:1px solid #455474;border-radius:12px;padding:12px 18px;color:white;font-weight:750}.btn:hover{filter:brightness(1.13)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#17112c}.btn.mint{background:#205f59;border-color:#379786}.btn.outline{background:transparent}.btn:disabled{opacity:.45;cursor:not-allowed}.progress{height:9px;background:#2b3650;border-radius:99px;overflow:hidden;margin:14px 0 7px}.progress>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--a2));transition:width .2s}.micro{color:var(--muted);font-size:13px}.quizword{font:700 clamp(30px,5vw,45px) Georgia,serif;margin:35px 0}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{background:#1e2a45;border:1px solid #425170;color:white;text-align:left;padding:17px;border-radius:15px;min-height:78px;line-height:1.5}.option:hover:not(:disabled){border-color:var(--accent);background:#293353}.option.correct{background:#17463e;border-color:var(--good)}.option.wrong{background:#58303d;border-color:var(--bad)}.option:disabled{cursor:default}.feedback{min-height:50px;margin-top:14px;font-size:15px;font-weight:700;line-height:1.7}.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}.list{display:grid;gap:10px}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#1b2740;border:1px solid #35435e;border-radius:13px;padding:14px 16px}.item strong{font-family:Georgia,serif;font-size:20px}.item p{color:var(--muted);margin:6px 0 0;font-size:14px}.empty{text-align:center;padding:55px 12px;color:var(--muted);border:1px dashed #4e5c78;border-radius:15px}.search{width:100%;background:#19243d;border:1px solid #4a5773;border-radius:12px;color:#fff;padding:12px 14px;margin-bottom:15px}.foot{color:#8292ae;font-size:12px;text-align:center;margin-top:22px;line-height:1.8}#app-status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}@media(max-width:650px){.wrap{padding-top:23px}.hero{display:block}.hero-tag{display:inline-block;margin-top:18px}.statgrid{gap:8px}.stat{padding:14px 11px}.stat strong{font-size:24px}.shell{padding:16px}.options{grid-template-columns:1fr}.tab{padding:10px 12px}.item{align-items:flex-start}.btn{padding:11px 14px}}
</style>
</head>
<body>
<main class="wrap">
 <header class="hero"><div><div class="eyebrow">STUDY SMARTER · NOT HARDER</div><h1>GRE Word <span style="color:#b6a9ff">Sprint</span> 🚀</h1><p class="sub">翻卡記憶、限量測驗、錯題重練。每天用一點時間，把難字真正記住。</p></div><div class="hero-tag">✦ 每次練習，都是進步</div></header>
 <section class="statgrid" aria-label="學習統計"><div class="stat"><span>單字總數</span><strong id="total">0</strong></div><div class="stat"><span>已掌握單字</span><strong id="mastered">0</strong></div><div class="stat"><span>累積答對率</span><strong id="accuracy">—</strong></div></section>
 <div class="shell"><nav class="tabs" aria-label="功能選單"><button class="tab active" data-tab="cards">🗂 單字卡</button><button class="tab" data-tab="quiz">⚡ 快速測驗</button><button class="tab" data-tab="mistakes">📌 錯題本</button><button class="tab" data-tab="library">📚 單字庫</button></nav><section id="content" aria-live="polite"></section></div>
 <p class="foot">資料只儲存在你的瀏覽器（localStorage），不會上傳到伺服器。清除瀏覽器資料可能重置進度。<br>Made for GRE learners · Single-file Web App</p>
</main>
<div id="app-status" role="status" aria-live="polite"></div>
<script>
'use strict';
const WORDS=[
 ['abjure','正式放棄；發誓戒除','He decided to abjure his former beliefs.'],
 ['adjure','鄭重懇求；命令','The judge adjured the witness to tell the truth.'],
 ['ethereal','輕盈飄逸的；超凡脫俗的','The music had an ethereal quality.'],
 ['scrupulous','一絲不苟的；有道德原則的','She was scrupulous about checking every figure.'],
 ['unscrupulous','肆無忌憚的；不擇手段的','An unscrupulous trader misled investors.'],
 ['inscrutable','難以理解的；高深莫測的','His expression remained inscrutable.'],
 ['indolent','懶惰的；不活躍的','An indolent attitude slowed the project.'],
 ['tenacious','堅韌的；執著的','Her tenacious efforts finally paid off.'],
 ['provisional','暫時的；臨時性的','The committee reached a provisional agreement.'],
 ['provident','有遠見的；節儉的','Their provident planning prevented a crisis.'],
 ['ingratiating','討好的；逢迎的','His ingratiating tone sounded insincere.'],
 ['gratuitous','無端的；不必要的；免費的','The article contained gratuitous criticism.'],
 ['turgid','腫脹的；浮誇冗長的','The essay was full of turgid prose.'],
 ['turbid','混濁的；不清楚的','The river became turbid after the storm.'],
 ['perquisite','額外津貼；職務福利','Free housing was a perquisite of the job.'],
 ['relentless','不屈不撓的；持續不斷的','The team faced relentless pressure.'],
 ['pensive','沉思的；憂思的','She grew pensive after reading the letter.'],
 ['propitiate','安撫；討好（以求息怒）','They tried to propitiate the angry customer.'],
 ['desiccation','乾燥；脫水','Desiccation threatened the fragile plants.'],
 ['disquisition','詳盡的論述；專題論文','The lecture became a long disquisition on ethics.']
].map(([word,meaning,example])=>({word,meaning,example}));
const KEY='gre-word-sprint-v1';
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));return {mastered:Array.isArray(v?.mastered)?v.mastered.filter(x=>typeof x==='string'):[],mistakes:Array.isArray(v?.mistakes)?v.mistakes.filter(x=>typeof x==='string'):[],correct:Number.isFinite(v?.correct)?v.correct:0,attempts:Number.isFinite(v?.attempts)?v.attempts:0}}catch(e){}return {mastered:[],mistakes:[],correct:0,attempts:0}}
let store=load(),tab='cards',cardIndex=0,flipped=false,quiz=[],qIndex=0,qAnswered=false,qScore=0,choice=-1,query='';
const content=document.getElementById('content');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){document.getElementById('app-status').textContent='瀏覽器無法儲存學習進度';}stats()}
function stats(){document.getElementById('total').textContent=WORDS.length;document.getElementById('mastered').textContent=store.mastered.filter(w=>WORDS.some(x=>x.word===w)).length;document.getElementById('accuracy').textContent=store.attempts?Math.round(store.correct/store.attempts*100)+'%':'—'}
function switchTab(next){tab=next;document.querySelectorAll('.tab').forEach(x=>{let active=x.dataset.tab===tab;x.classList.toggle('active',active);x.setAttribute('aria-current',active?'page':'false')});render()}
function render(){if(tab==='cards')renderCards();if(tab==='quiz')renderQuiz();if(tab==='mistakes')renderMistakes();if(tab==='library')renderLibrary()}
function renderCards(){let w=WORDS[cardIndex],done=store.mastered.includes(w.word);content.innerHTML=`<h2 class="section-title">單字翻翻卡</h2><p class="section-desc">點卡片看中文解釋與例句；確認自己會了，再標記「已掌握」。</p><div class="micro">第 ${cardIndex+1} / ${WORDS.length} 張 · 已掌握 ${store.mastered.length} 個</div><div class="progress"><div style="width:${(cardIndex+1)/WORDS.length*100}%"></div></div><div class="flash center" id="flash" role="button" tabindex="0" aria-label="翻轉單字卡">${flipped?`<span class="pill">${esc(w.word)}</span><div class="definition">${esc(w.meaning)}</div><p class="example">${esc(w.example)}</p><div class="hint">點擊返回英文</div>`:`<span class="pill">GRE Vocabulary</span><div class="word">${esc(w.word)}</div><div class="hint">👆 點一下翻面，看看你記得多少</div>`}</div><div class="controls"><button class="btn" id="prev">← 上一張</button><button class="btn primary" id="flip">${flipped?'返回英文':'翻面看答案'}</button><button class="btn ${done?'outline':'mint'}" id="mark">${done?'↩ 取消已掌握':'✓ 我記住了'}</button><button class="btn" id="next">下一張 →</button></div>`;const flip=()=>{flipped=!flipped;renderCards()};document.getElementById('flash').onclick=flip;document.getElementById('flash').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};document.getElementById('flip').onclick=flip;document.getElementById('prev').onclick=()=>{cardIndex=(cardIndex+WORDS.length-1)%WORDS.length;flipped=false;renderCards()};document.getElementById('next').onclick=()=>{cardIndex=(cardIndex+1)%WORDS.length;flipped=false;renderCards()};document.getElementById('mark').onclick=()=>{store.mastered=done?store.mastered.filter(x=>x!==w.word):[...store.mastered,w.word];save();renderCards()}}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function startQuiz(type='all'){let pool=type==='wrong'?WORDS.filter(w=>store.mistakes.includes(w.word)):WORDS;if(pool.length===0)return;quiz=shuffle(pool).slice(0,Math.min(10,pool.length)).map(w=>({word:w,options:shuffle([w,...shuffle(WORDS.filter(x=>x.word!==w.word)).slice(0,3)])}));qIndex=0;qAnswered=false;qScore=0;choice=-1;switchTab('quiz')}
function renderQuiz(){if(!quiz.length){content.innerHTML=`<h2 class="section-title">10 題快速測驗 ⚡</h2><p class="section-desc">每題選出最符合英文單字的中文意思，答錯自動加入錯題本。題目與選項隨機排列。</p><div class="center" style="padding:45px 10px"><div style="font-size:55px">🎯</div><h3>準備挑戰了嗎？</h3><p class="section-desc">從 ${WORDS.length} 個單字中隨機抽出 10 題</p><button class="btn primary" id="start">開始測驗 →</button></div>`;document.getElementById('start').onclick=()=>startQuiz();return}
if(qIndex>=quiz.length){let pct=Math.round(qScore/quiz.length*100);content.innerHTML=`<div class="center" style="padding:45px 10px"><div style="font-size:60px">${pct>=80?'🏆':'💪'}</div><h2>測驗完成！</h2><div style="font-size:55px;font-weight:800;color:var(--a2)">${qScore} / ${quiz.length}</div><p class="section-desc">正確率 ${pct}% · 答錯的單字已收入錯題本</p><div class="controls"><button class="btn primary" id="restart">再練一次</button><button class="btn" id="review">查看錯題本</button></div></div>`;document.getElementById('restart').onclick=()=>startQuiz();document.getElementById('review').onclick=()=>switchTab('mistakes');return}
let q=quiz[qIndex];content.innerHTML=`<h2 class="section-title">快速測驗</h2><div class="micro">第 ${qIndex+1} / ${quiz.length} 題 · 本回合答對 ${qScore} 題</div><div class="progress"><div style="width:${qIndex/quiz.length*100}%"></div></div><div class="center"><div class="quizword">${esc(q.word.word)}</div><p class="section-desc">請選出最接近的中文意思</p></div><div class="options">${q.options.map((o,i)=>`<button class="option ${qAnswered?(o.word===q.word.word?'correct':(i===choice?'wrong':'')):''}" data-option="${i}" ${qAnswered?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(o.meaning)}</button>`).join('')}</div><div class="feedback ${qAnswered?(choice===q.options.findIndex(w=>w.word===q.word.word)?'good':'bad'):''}" aria-live="polite">${qAnswered?(choice===q.options.findIndex(w=>w.word===q.word.word)?'✓ 答對了！':'✗ 正確答案：'+esc(q.word.meaning))+'<br><span class="micro">'+esc(q.word.example)+'</span>':''}</div><div class="controls">${qAnswered?'<button class="btn primary" id="advance">'+(qIndex===quiz.length-1?'查看成績':'下一題 →')+'</button>':''}</div>`;
if(!qAnswered)document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{choice=Number(b.dataset.option);qAnswered=true;store.attempts++;if(q.options[choice].word===q.word.word){qScore++;store.correct++;store.mistakes=store.mistakes.filter(x=>x!==q.word.word)}else if(!store.mistakes.includes(q.word.word))store.mistakes.push(q.word.word);save();renderQuiz()});else document.getElementById('advance').onclick=()=>{qIndex++;qAnswered=false;choice=-1;renderQuiz()}}
function renderMistakes(){let arr=WORDS.filter(w=>store.mistakes.includes(w.word));content.innerHTML=`<h2 class="section-title">錯題本 📌</h2><p class="section-desc">答錯的單字會自動收錄；在測驗中答對後會自動移出，也可以手動移除。</p>${arr.length?`<div class="controls" style="justify-content:flex-start;margin:0 0 16px"><button class="btn primary" id="retry">只練錯題 (${arr.length})</button></div><div class="list">${arr.map(w=>`<div class="item"><div><strong>${esc(w.word)}</strong><p>${esc(w.meaning)}</p></div><button class="btn outline" data-remove="${esc(w.word)}" aria-label="移除 ${esc(w.word)}">移除</button></div>`).join('')}</div>`:`<div class="empty">🎉 目前沒有錯題！<br>去做一次快速測驗吧。</div>`}`;document.getElementById('retry')?.addEventListener('click',()=>startQuiz('wrong'));content.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{store.mistakes=store.mistakes.filter(w=>w!==b.dataset.remove);save();renderMistakes()})}
function renderLibrary(){let arr=WORDS.filter(w=>w.word.includes(query.toLowerCase())||w.meaning.includes(query));content.innerHTML=`<h2 class="section-title">完整單字庫 📚</h2><p class="section-desc">查詢單字、中文解釋與例句。點擊「看單字卡」可跳到該單字。</p><input id="search" class="search" type="search" placeholder="搜尋英文或中文意思…" value="${esc(query)}" aria-label="搜尋單字"/><div id="results" class="list"></div>`;const search=document.getElementById('search');const results=document.getElementById('results');const paint=()=>{let a=WORDS.filter(w=>w.word.includes(query.toLowerCase())||w.meaning.includes(query));results.innerHTML=a.length?a.map(w=>`<div class="item"><div><strong>${esc(w.word)}</strong><p>${esc(w.meaning)}</p><p style="font-size:12px">${esc(w.example)}</p></div><button class="btn outline" data-goto="${esc(w.word)}">看單字卡</button></div>`).join(''):'<div class="empty">找不到符合的單字</div>';results.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{cardIndex=WORDS.findIndex(w=>w.word===b.dataset.goto);flipped=false;switchTab('cards')})};search.oninput=e=>{query=e.target.value;paint()};paint()}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));stats();render();
</script>
</body>
</html>
